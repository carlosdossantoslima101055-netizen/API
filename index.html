<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bem-vindo</title>
<style>
  body{font-family:Arial,sans-serif;margin:0;min-height:100vh;display:flex;flex-direction:column;
       align-items:center;justify-content:center;background:#111;color:#eee;text-align:center;padding:20px;box-sizing:border-box}
  h1{font-size:28px}
  small{position:fixed;bottom:12px;left:12px;right:12px;color:#888;font-size:12px}
</style>
</head>
<body>
  <h1>Bem-vindo</h1>
  <small>Este site registra seu endereço IP e o horário do acesso para fins de controle e segurança.</small>

<script>
(function () {
  try { if (sessionStorage.getItem("registrado")) return; } catch (e) {}
  fetch("/api/registrar", { method: "POST", keepalive: true })
    .then(function (r) { if (r.ok) { try { sessionStorage.setItem("registrado", "1"); } catch (e) {} } })
    .catch(function () {});
})();
</script>
</body>
</html>
